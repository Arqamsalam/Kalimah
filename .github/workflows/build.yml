name: Build and publish

# Runs every time you add or change a guide, then publishes the site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild data/surahs.js from guides/
        run: python3 build.py

      - name: Fetch the Qur'an text for any new surah
        run: python3 fetch_verses.py

      - name: Rebuild the root and grammar data
        run: python3 build_morph.py

      - name: Rebuild the ṣarf tables
        run: python3 build_sarf.py

      # Each data file's ?v= in index.html is a fingerprint of its contents,
      # so it changes exactly when the file does — a browser never pairs a
      # new page with yesterday's cached data. It is committed with the data,
      # which keeps it right however Pages publishes (branch or Actions).
      - name: Stamp the data files in index.html
        run: python3 stamp.py

      - name: Commit the rebuilt data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/surahs.js data/verses.js data/morph.js data/sarf.js index.html
          git diff --staged --quiet || git commit -m "Rebuild vocabulary and verse data"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
