name: Build and publish

# Runs every time you add or change a guide, then publishes the site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild data/surahs.js from guides/
        run: python3 build.py

      - name: Fetch the Qur'an text for any new surah
        run: python3 fetch_verses.py

      - name: Rebuild the root and grammar data
        run: python3 build_morph.py

      - name: Rebuild the ṣarf tables
        run: python3 build_sarf.py

      - name: Commit the rebuilt data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/surahs.js data/verses.js data/morph.js data/sarf.js
          git diff --staged --quiet || git commit -m "Rebuild vocabulary and verse data"
          git push

      # Every publish gets its own ?v= stamp on the data files, so a browser
      # never pairs a new index.html with yesterday's cached data. Only the
      # published copy is stamped; the file in the repo keeps ?v=dev.
      - name: Stamp the data files with this build
        run: sed -i "s/?v=[A-Za-z0-9]*\"/?v=${GITHUB_SHA::8}\"/g" index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
